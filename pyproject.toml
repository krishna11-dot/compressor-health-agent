[project]
name = "compressor-agent"
version = "0.1.0"
description = "Governed predictive-maintenance agent on real compressor sensor data"
authors = [
    { name = "krishna11-dot", email = "krishnanair041@gmail.com" }
]
requires-python = ">=3.12.10"
dependencies = [
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
